<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sprechstunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>/* Layout: one centred working column; tab bar at the bottom on phones, at the top on wide screens. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #141a21; --muted: #586472; --line: #d8dee5;
  --accent: #e3a21a; --accent-ink: #1d1503; --focus: #2a62c9;
  --der: #2a62c9; --die: #cc2f47; --das: #1d8551;
  --close: #b25e09; --ok: #217a4b; --ok-bg: #e3f4ea; --bad: #b8322a; --bad-bg: #fbe7e5; --warn-bg: #fdf3dc;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1317; --surface: #182028; --surface-2: #202932; --ink: #e8edf2; --muted: #9ba7b4; --line: #2c3743;
  --accent: #f0b443; --accent-ink: #1d1503; --focus: #7aa7f5;
  --der: #74a2f2; --die: #f27389; --das: #52c48a;
  --close: #f0a24b; --ok: #5fd096; --ok-bg: #173527; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn-bg: #3a3017; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1317; --surface: #182028; --surface-2: #202932; --ink: #e8edf2; --muted: #9ba7b4; --line: #2c3743;
  --accent: #f0b443; --accent-ink: #1d1503; --focus: #7aa7f5;
  --der: #74a2f2; --die: #f27389; --das: #52c48a;
  --close: #f0a24b; --ok: #5fd096; --ok-bg: #173527; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn-bg: #3a3017; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }

.g-der { color: var(--der); font-weight: 700; }
.g-die { color: var(--die); font-weight: 700; }
.g-das { color: var(--das); font-weight: 700; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.2rem; display: flex; align-items: baseline; gap: 6px; }
.brand small { font-family: var(--body); font-weight: 700; font-size: .7rem; color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: 6px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 10px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 110px; display: grid; gap: 20px; }
@media (max-width: 759px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 8px; }
  .tab[aria-current="page"] { box-shadow: none; background: var(--surface-2); }
  h1 { font-size: 1.6rem; }
}

/* surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.stack { display: grid; gap: 12px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.big { padding: 14px 20px; font-size: 1.05rem; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

/* home */
.hero { display: grid; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.action { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.action:hover { background: var(--surface-2); }
.action .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
.action .ico svg { width: 22px; height: 22px; }
.action.main .ico { background: var(--accent); color: var(--accent-ink); }
.action .count { font-family: var(--display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px 4px 4px; display: inline-flex; align-items: center; gap: 8px; font-size: .95rem; }
.chip .icon-btn { width: 28px; height: 28px; }
.chip .icon-btn svg { width: 14px; height: 14px; }
.note { background: var(--warn-bg); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }

/* course */
.lesson { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.lesson:hover { background: var(--surface-2); }
.lesson .n { font-family: var(--display); font-weight: 800; font-size: 1.35rem; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.lesson.on .n { background: var(--ink); color: var(--bg); }
.lesson.done .n { background: var(--accent); color: var(--accent-ink); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.subtab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; white-space: nowrap; color: var(--muted); }
.subtab[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wordlist { display: grid; }
.word { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.word:last-child { border-bottom: 0; }
.word .de { font-weight: 700; font-size: 1.05rem; }
.word .meta { font-size: .88rem; color: var(--muted); }
.gram { display: grid; gap: 10px; }
.gram p { max-width: 65ch; }
.tablewrap { overflow-x: auto; }
.gram table { border-collapse: collapse; font-size: .95rem; min-width: 100%; }
.gram th, .gram td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.gram th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tip { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: .93rem; }
.ex { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ex:last-child { border-bottom: 0; }
.ex .q { font-weight: 700; font-size: 1.05rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 700; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.gapin { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; width: 9em; font-weight: 700; }
.gapin.right { border-color: var(--ok); background: var(--ok-bg); }
.gapin.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; }
.tile { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; border-radius: 8px; font-weight: 700; }
.answerline { border: 1px dashed var(--line); border-radius: 10px; padding: 6px; }
.fb { font-size: .92rem; font-weight: 700; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }

/* flashcards */
.cardbox { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; display: grid; gap: 18px; text-align: center; min-height: 340px; align-content: center; justify-items: center; }
.cardbox .prompt { font-size: 1.5rem; font-weight: 700; font-family: var(--display); }
.cardbox .answer { font-family: var(--display); font-size: 2.4rem; font-weight: 750; line-height: 1.1; overflow-wrap: anywhere; }
.cardbox .sub { color: var(--muted); }
.cardbox .example { font-size: 1rem; max-width: 46ch; }
.badge { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.new { background: var(--accent); color: var(--accent-ink); }
.badge.hard { background: var(--bad-bg); color: var(--bad); }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.grade { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; font-weight: 800; display: grid; gap: 2px; }
.grade span { font-weight: 400; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.grade.g0 { color: var(--bad); }
.grade.g3 { color: var(--ok); }
.progress { display: flex; align-items: center; gap: 10px; }
.progress .bar { flex: 1; }
.typein { width: 100%; max-width: 380px; text-align: center; font-size: 1.4rem; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); font-weight: 700; }
.typein:focus { border-color: var(--focus); outline: none; }
.umlauts { display: flex; gap: 6px; justify-content: center; }
.umlauts button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; width: 40px; height: 36px; font-weight: 700; }
.result { border-radius: 12px; padding: 10px 14px; font-weight: 700; width: 100%; max-width: 440px; }
.result.ok { background: var(--ok-bg); color: var(--ok); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.result.meh { background: var(--warn-bg); }
.gbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 440px; }
.gbtn { border: 2px solid currentColor; background: var(--surface); border-radius: 14px; padding: 16px 0; font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
.gbtn.der { color: var(--der); } .gbtn.die { color: var(--die); } .gbtn.das { color: var(--das); }
.gbtn:disabled { opacity: .35; }
.gbtn.picked { background: currentColor; }
.gbtn.picked span { color: var(--surface); }
.modes { display: flex; flex-wrap: wrap; gap: 6px; }

/* speaking */
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px -6px rgba(0,0,0,.35); }
.mic svg { width: 34px; height: 34px; }
.mic.live { animation: pulse 1.2s ease-in-out infinite; background: var(--bad); color: #fff; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(204,47,71,.45); } 50% { box-shadow: 0 0 0 16px rgba(204,47,71,0); } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } }
.heard { min-height: 1.5em; font-size: 1.05rem; color: var(--muted); font-style: italic; }
.sentence { font-family: var(--display); font-size: 1.6rem; font-weight: 700; line-height: 1.25; max-width: 30ch; }
.w-ok { color: var(--ok); }
.w-close { color: var(--close); text-decoration: underline dotted; text-underline-offset: 4px; }
.w-miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.coach, .recorder { display: grid; gap: 10px; width: 100%; max-width: 560px; text-align: left; }
.recorder { border-top: 1px solid var(--line); padding-top: 14px; justify-items: center; }
.coach-item { display: grid; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.coach-item b { font-size: 1.15rem; }
.coach .tip, .coach .result { background: var(--surface); max-width: none; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--focus); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.rec-live { background: var(--bad); color: #fff; border-color: var(--bad); }
.soundgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.soundcard { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.soundcard:hover { background: var(--surface-2); }
.soundcard span { display: grid; }
.soundcard .glyph { font-family: var(--display); font-weight: 800; font-size: 1.15rem; width: 56px; height: 56px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; text-align: center; line-height: 1; }
.drill { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drill:last-child { border-bottom: 0; }
.drillword { font-size: 1.2rem; }
.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 6px 0; }
.score { font-family: var(--display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.models { display: grid; gap: 6px; width: 100%; max-width: 480px; text-align: left; }
.model { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 6px 10px 6px 6px; }
.model .icon-btn { width: 32px; height: 32px; }
.hidden-text { filter: blur(7px); user-select: none; cursor: pointer; }
select, .field { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
textarea.field { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 20; }
.kbd { font-size: .75rem; color: var(--muted); }
@media (hover: none) { .kbd { display: none; } }

/* rewards */
.goal { grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; display: grid; place-content: center; text-align: center; line-height: 1.1;
  background: radial-gradient(closest-side, var(--surface) 78%, transparent 79% 100%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring b { font-family: var(--display); font-size: 1.5rem; }
.stars { letter-spacing: 1px; color: var(--line); font-size: 1rem; }
.stars .on { color: var(--accent); }
.bigstars .stars { font-size: 2.6rem; }
.badge.win { background: var(--accent); color: var(--accent-ink); }
.partdots { display: flex; gap: 4px; }
.partdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.partdots i.on { background: var(--ok); border-color: var(--ok); }
.pathstep { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.pathstep span { display: grid; }
.pathstep .pn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; }
.pathstep.on .pn { background: var(--ok); color: #fff; }
.stepfoot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.donetag { color: var(--ok); font-weight: 800; }
.xppop { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 8px 16px; border-radius: 999px; z-index: 40; pointer-events: none; animation: xp 1.5s ease-out forwards; }
@keyframes xp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.celebrate { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 18, .55); display: grid; place-items: center; padding: 16px; }
.celebrate-box { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 28px 22px; max-width: 420px; width: 100%; display: grid; gap: 14px; text-align: center; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
.celebrate-title { font-family: var(--display); font-size: 2rem; font-weight: 800; line-height: 1.1; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .xppop, .celebrate-box { animation: none; } }

/* speak-first cards */
.speakcard .prompt.big { font-size: 2.1rem; line-height: 1.15; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; max-width: 460px; border-radius: 14px; padding: 12px 14px; }
.verdict > div:last-child { display: grid; gap: 4px; }
.verdict b { font-size: 1.1rem; }
.verdict .vicon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; color: #fff; }
.verdict.ok { background: var(--ok-bg); } .verdict.ok .vicon { background: var(--ok); }
.verdict.close { background: var(--warn-bg); } .verdict.close .vicon { background: var(--close); }
.verdict.bad { background: var(--bad-bg); } .verdict.bad .vicon { background: var(--bad); }
.speakcard > .verdict:not(:has(.vicon)) { grid-template-columns: 1fr; }
.tipline { margin-top: 6px; font-size: .92rem; background: var(--surface); border-radius: 10px; padding: 8px 10px; }

/* guided lesson */
.today { display: flex; flex-direction: column; gap: 12px; }
.plan { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.btn.big { font-size: 1.1rem; padding: 14px 22px; justify-content: center; }
.today .btn.big { width: 100%; }
.extra summary { cursor: pointer; padding: 6px 0; }
.extra .row { margin-top: 8px; flex-wrap: wrap; }
.partdots span.on { color: var(--ok); font-weight: 700; }
.teach { gap: 14px; }
.teach h2 { margin: 0; }
.teacher { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; max-width: 520px; }
.teacher .avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
.teacher .bubble { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; line-height: 1.45; }
.teach .sentence { font-family: var(--display); font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.teach .gram table { border-collapse: collapse; }
.teach .tablewrap { overflow-x: auto; }
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.sumgrid > div { display: flex; flex-direction: column; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.sumgrid .num { font-size: 1.6rem; }
.teach .pn { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; flex: none; }
.teach .pn.on { background: var(--ok); color: #fff; }
.teach .ex .opt:disabled, .teach .ex .tile:disabled { opacity: 1; }
.tabs[hidden] { display: none !important; }
.goal .partdots { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.levelhead { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.lvrow { display: grid; grid-template-columns: 2.4em 1fr 10em; align-items: center; gap: 10px; padding: 6px 0; }
.lvrow .bar { height: 8px; }
.pqopts { flex-direction: column; width: 100%; max-width: 420px; }
.pqopts .opt { width: 100%; font-size: 1.1rem; padding: 12px 14px; }

/* Lehrer chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.chat .teacher { max-width: none; }
.chat .teacher .bubble { overflow-wrap: anywhere; }
.chat .teacher .icon-btn { margin-top: 6px; }
.me { display: flex; justify-content: flex-end; }
.me .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 14px 4px 14px 14px; padding: 10px 14px; line-height: 1.45; max-width: 85%; overflow-wrap: anywhere; }
.chatin { display: flex; flex-direction: column; gap: 8px; }
.chatin textarea { width: 100%; resize: vertical; min-height: 64px; font: inherit; }
.chatin .row { justify-content: flex-end; flex-wrap: wrap; }
.chatin .umlauts { margin-right: auto; }
a.btn { text-decoration: none; color: inherit; }
.chat .starter { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.modelpick { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; }
.modelpick select { width: auto; padding: 6px 10px; }
.notes { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.notes li span { margin-right: 8px; }
.recording { display: flex; align-items: center; gap: 8px; color: var(--bad); font-weight: 700; font-size: .9rem; }
.recording .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.chatin textarea.live { border-color: var(--bad); box-shadow: 0 0 0 2px rgba(204,47,71,.25); }
.btn.rec-stop { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .recording .dot, .btn.rec-stop { animation: none; } }
.chatlog { display: flex; flex-direction: column; gap: 12px; max-height: max(240px, calc(100dvh - 430px)); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.convs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.convs li { display: flex; align-items: center; gap: 8px; }
.convs li.on .conv { border-color: var(--accent); }
.conv { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; color: inherit; cursor: pointer; }
.conv span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.teach .hintline { color: var(--muted); font-size: 1.2rem; }
.teach .model .sentence { font-size: 1.15rem; }
.plan.path { list-style: none; padding: 0; gap: 0; counter-reset: step; }
.plan.path li { counter-increment: step; position: relative; padding: 4px 0 12px 40px; min-height: 28px; }
.plan.path li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
.plan.path li:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.lpath { display: flex; flex-wrap: wrap; gap: 4px; }
.lpath span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.lpath span.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.lpath span.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.convo-log { display: grid; gap: 10px; width: 100%; max-width: 560px; text-align: left; }
.convo-log .teacher { max-width: none; }
</style>
<script src="config.js"></script>
</head>

    { t: "Reflexive verbs", html: `
<p>Some verbs need a <b>reflexive pronoun</b> that refers back to the subject: <i>sich fühlen, sich ausruhen, sich bewegen</i>.</p>
<table><tr><th>Subject</th><th>Pronoun</th><th>Example</th></tr>
<tr><td>ich</td><td><b>mich</b></td><td>Ich fühle <b>mich</b> gut.</td></tr>
<tr><td>du</td><td><b>dich</b></td><td>Ruhst du <b>dich</b> aus?</td></tr>
<tr><td>er / sie / es</td><td><b>sich</b></td><td>Sie ernährt <b>sich</b> gesund.</td></tr>
<tr><td>wir</td><td><b>uns</b></td><td>Wir bewegen <b>uns</b> zu wenig.</td></tr>
<tr><td>ihr</td><td><b>euch</b></td><td>Entspannt ihr <b>euch</b>?</td></tr>
<tr><td>sie / Sie</td><td><b>sich</b></td><td>Erholen Sie <b>sich</b> gut!</td></tr></table>
<p>The pronoun comes right after the verb (or after the subject if it's inverted). Perfekt uses <b>haben</b>: <i>Er hat sich verletzt.</i></p>
<p class="tip">Hebrew has the same idea in the hitpa'el pattern: להתלבש, להתרגש, להתרחץ. English often drops the "-self": "I feel" = ich fühle <b>mich</b>.</p>` },
    { t: "Advice with sollte", html: `
<p>To give friendly advice, use <b>sollte</b> (= should) + infinitive at the end.</p>
<table><tr><th></th><th>sollen → sollte</th></tr>
<tr><td>ich</td><td>sollte</td></tr>
<tr><td>du</td><td>solltest</td></tr>
<tr><td>er / sie / es</td><td>sollte</td></tr>
<tr><td>wir</td><td>sollten</td></tr>
<tr><td>ihr</td><td>solltet</td></tr>
<tr><td>sie / Sie</td><td>sollten</td></tr></table>
<p><i>Du <b>solltest</b> mehr Wasser <b>trinken</b>.</i> · <i>Sie <b>sollten</b> mit dem Rauchen <b>aufhören</b>.</i></p>
<p class="tip"><b>sollte</b> is softer than <b>musst</b>: Du musst … = you have to; Du solltest … = it would be a good idea.</p>` },
    { t: "The imperative", html: `
<p>For direct tips and instructions use the imperative.</p>
<table><tr><th>Form</th><th>How</th><th>Example</th></tr>
<tr><td>du</td><td>du-form without -st / du</td><td>du trinkst → <b>Trink</b> mehr Wasser!</td></tr>
<tr><td>du (e→i verbs)</td><td>keep the i</td><td>du nimmst → <b>Nimm</b> die Treppe!</td></tr>
<tr><td>ihr</td><td>ihr-form without ihr</td><td>ihr esst → <b>Esst</b> mehr Obst!</td></tr>
<tr><td>Sie</td><td>verb + Sie</td><td><b>Machen Sie</b> regelmäßig Sport!</td></tr></table>
<p>Reflexive: <i><b>Ruh dich</b> aus! · <b>Ruht euch</b> aus! · <b>Ruhen Sie sich</b> aus!</i></p>
<p class="tip">Add <b>doch</b> or <b>mal</b> to make it sound friendlier: <i>Geh doch mal spazieren!</i></p>` }

<p>To compare two things, add <b>-er</b> to the adjective and use <b>als</b> (than).</p>
<table><tr><th>Adjective</th><th>Comparative</th><th>Example</th></tr>
<tr><td>schnell</td><td>schnell<b>er</b></td><td>Der Zug ist schneller <b>als</b> der Bus.</td></tr>

<p>For "the most", use <b>am … -sten</b> after a verb, or <b>der/die/das … -ste</b> before a noun.</p>

<p><b>wenn</b> = if / when(ever). Like weil, it sends the verb to the <b>end</b>.</p>

<p>In recipes and instructions, the order words go in <b>position 1</b>. The verb stays in <b>position 2</b>, so the subject moves behind it.</p>
<table><tr><th>1</th><th>2 (verb)</th><th>subject</th><th>rest</th></tr>
<tr><td><b>Zuerst</b></td><td>schneidet</td><td>man</td><td>die Zwiebeln.</td></tr>

<tr><td><b>Zum Schluss</b></td><td>kommen</td><td>Salz und Pfeffer</td><td>dazu.</td></tr></table>
<p>Recipes usually use <b>man</b> (= you, one) or the polite imperative: <i>Schneiden Sie die Zwiebeln.</i></p>

<p>Be careful: <b>nicht müssen</b> and <b>nicht dürfen</b> mean very different things.</p>
<table><tr><th>German</th><th>Meaning</th><th>Example</th></tr>
<tr><td>müssen</td><td>must, have to</td><td>Sie <b>müssen</b> das Formular unterschreiben.</td></tr>
<tr><td><b>nicht müssen</b></td><td>don't have to (not necessary)</td><td>Sie <b>müssen</b> keinen Termin vereinbaren.</td></tr>
<tr><td><b>nicht brauchen zu</b> + Inf.</td><td>don't need to (= nicht müssen)</td><td>Sie <b>brauchen nicht zu</b> warten.</td></tr>
<tr><td>dürfen</td><td>may, be allowed to</td><td>Hier <b>dürfen</b> Sie parken.</td></tr>
<tr><td><b>nicht dürfen</b></td><td>must not (forbidden)</td><td>Hier <b>darf</b> man <b>nicht</b> rauchen.</td></tr></table>
<p class="tip">English "you must not" = <b>du darfst nicht</b> (Hebrew: אסור). "You don't have to" = <b>du musst nicht</b> / <b>du brauchst nicht zu …</b> (Hebrew: לא חייב). With <b>brauchen</b> the infinitive needs <b>zu</b>.</p>` },
    { t: "da- and wo- compounds", html: `
<p>Many verbs have a fixed preposition (warten <b>auf</b>, sich interessieren <b>für</b>). When you refer back to a <b>thing</b>, don't say "auf es" — say <b>da + preposition</b>. To ask about a thing, use <b>wo + preposition</b>. Add <b>r</b> if the preposition starts with a vowel.</p>
<table><tr><th>Preposition</th><th>Answer (thing)</th><th>Question (thing)</th></tr>
<tr><td>auf</td><td>da<b>r</b>auf</td><td>wo<b>r</b>auf?</td></tr>
<tr><td>für</td><td>dafür</td><td>wofür?</td></tr>
<tr><td>über</td><td>da<b>r</b>über</td><td>wo<b>r</b>über?</td></tr>
<tr><td>an</td><td>da<b>r</b>an</td><td>wo<b>r</b>an?</td></tr>
<tr><td>mit</td><td>damit</td><td>womit?</td></tr></table>
<p><i>Worauf wartest du? – Auf die Bescheinigung. Ich warte schon lange <b>darauf</b>.</i></p>

    { t: "Relative clauses: Nominativ and Akkusativ", html: `
<p>A relative clause describes a noun, like English "who / which / that". It is separated by commas, starts with a relative pronoun, and the verb goes to the <b>end</b>.</p>
<p>The pronoun takes its <b>gender and number from the noun</b>, but its <b>case from its job inside the relative clause</b>.</p>
<table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Nominativ</td><td>der</td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Akkusativ</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr></table>
<p><i>Der Nachbar, <b>der</b> über mir wohnt, ist nett.</i> (he lives there → subject → Nominativ)</p>
<p><i>Der Nachbar, <b>den</b> ich oft treffe, ist nett.</i> (I meet him → object → Akkusativ)</p>
<p class="tip">English can drop "that" (the flat we bought). German never drops the relative pronoun, and unlike Hebrew <b>ש</b>, it changes form: <i>die Wohnung, <b>die</b> wir gekauft haben</i>.</p>` },

<table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Dativ</td><td>dem</td><td>der</td><td>dem</td><td><b>denen</b></td></tr></table>
<p><i>Die Frau, <b>der</b> ich geholfen habe, wohnt im dritten Stock.</i></p>
<p>A preposition goes <b>in front of</b> the pronoun:</p>

<p>With the same subject damit is possible too, but um … zu sounds more natural.</p>

    { t: "Präteritum for telling stories", html: `
<p>In conversation Germans mostly use the Perfekt. In written stories, and when telling a longer story, you meet the <b>Präteritum</b>. With sein, haben and modal verbs it's normal in speech too (war, hatte, konnte, musste).</p>
<table><tr><th></th><th>machen (regular)</th><th>fahren (irregular)</th></tr>
<tr><td>ich</td><td>mach<b>te</b></td><td>fuhr</td></tr>
<tr><td>du</td><td>mach<b>test</b></td><td>fuhr<b>st</b></td></tr>
<tr><td>er / sie / es</td><td>mach<b>te</b></td><td>fuhr</td></tr>
<tr><td>wir</td><td>mach<b>ten</b></td><td>fuhr<b>en</b></td></tr>
<tr><td>ihr</td><td>mach<b>tet</b></td><td>fuhr<b>t</b></td></tr>
<tr><td>sie / Sie</td><td>mach<b>ten</b></td><td>fuhr<b>en</b></td></tr></table>
<p>Irregular verbs change their stem and have no -te: gehen → <b>ging</b>, kommen → <b>kam</b>, sehen → <b>sah</b>, geben → <b>gab</b>, finden → <b>fand</b>, bleiben → <b>blieb</b>. Mixed verbs change the stem <i>and</i> add -te: denken → <b>dachte</b>, bringen → <b>brachte</b>, wissen → <b>wusste</b>.</p>
<p class="tip">ich and er/sie/es are always identical in the Präteritum: ich ging, er ging.</p>` },
    { t: "als or wenn?", html: `
<p>English "when" has three German partners.</p>
<table><tr><th>Word</th><th>Use</th><th>Example</th></tr>
<tr><td><b>als</b></td><td>one event or one period in the past</td><td>Als ich zehn war, zogen wir um.</td></tr>
<tr><td><b>wenn</b></td><td>repeated in the past (immer wenn)</td><td>Immer wenn wir Oma besuchten, backte sie Kuchen.</td></tr>
<tr><td><b>wenn</b></td><td>present or future</td><td>Wenn ich Zeit habe, rufe ich dich an.</td></tr>
<tr><td><b>wann</b></td><td>questions only</td><td>Wann seid ihr umgezogen?</td></tr></table>
<p class="tip">Quick test: did it happen <b>once</b> in the past? → <b>als</b>. Otherwise → wenn. All three send the verb to the end (except in a direct question with wann).</p>` },
    { t: "Plusquamperfekt with nachdem", html: `
<p>The Plusquamperfekt is "had done": <b>hatte / war</b> + Partizip II. It shows that something happened <b>before</b> another past event.</p>
<p>After <b>nachdem</b> use the Plusquamperfekt; in the main clause use the Präteritum.</p>
<table><tr><th>nachdem-clause (earlier)</th><th>main clause (later)</th></tr>
<tr><td>Nachdem wir <b>gegessen hatten</b>,</td><td><b>gingen</b> wir spazieren.</td></tr>
<tr><td>Nachdem sie nach Berlin <b>umgezogen war</b>,</td><td><b>fand</b> sie schnell neue Freunde.</td></tr></table>

    { t: "The genitive: whose?", html: `
<p>The Genitiv shows possession or belonging, like English 's or "of". It comes <b>after</b> the noun it describes.</p>
<table><tr><th></th><th>Nominativ</th><th>Genitiv</th></tr>
<tr><td>m</td><td>der Sender</td><td>das Programm <b>des</b> Sender<b>s</b></td></tr>

<tr><td>n</td><td>das Land</td><td>die Regierung <b>des</b> Land<b>es</b></td></tr>
<tr><td>pl</td><td>die Leser</td><td>die Meinung <b>der</b> Leser</td></tr></table>
<p>ein / mein: <b>eines</b>, <b>einer</b>, <b>eines</b> · <b>meines</b>, <b>meiner</b>, <b>meines</b>, <b>meiner</b> (pl).</p>
<p>Masculine and neuter nouns add <b>-s</b>; short ones often <b>-es</b> (des Landes, des Tages). Nouns like der Journalist, der Kunde take <b>-n</b>: des Journalist<b>en</b>.</p>
<p class="tip">Names just add -s with no apostrophe: <i>Ors Handy</i>. In speech people often say <i>das Handy von Or</i>. Like Hebrew סמיכות, the owner comes second: <i>das Haus des Lehrers</i> ≈ בית המורה.</p>` },

<p class="tip">In everyday speech you'll often hear the dative (<i>wegen dem Wetter</i>). In writing and in exams use the genitive. <b>während</b> is also a conjunction: <i>Während ich frühstücke, höre ich Nachrichten.</i> (verb at the end)</p>` }

<p>A group of <b>masculine</b> nouns adds <b>-(e)n</b> in every case except the nominative singular. In English nothing changes, so this is easy to forget.</p>
<table><tr><th></th><th>Singular</th><th>Singular</th><th>Plural</th></tr>

<tr><td>Akk.</td><td>den Kunde<b>n</b></td><td>den Student<b>en</b></td><td>die Kunde<b>n</b></td></tr>
<tr><td>Dat.</td><td>dem Kunde<b>n</b></td><td>dem Student<b>en</b></td><td>den Kunde<b>n</b></td></tr>
<tr><td>Gen.</td><td>des Kunde<b>n</b></td><td>des Student<b>en</b></td><td>der Kunde<b>n</b></td></tr></table>
<p>Which nouns? Masculine nouns ending in <b>-e</b> for people/animals (der Kunde, der Kollege, der Junge, der Neffe), nouns ending in <b>-ent, -ant, -ist, -at</b> (der Student, der Praktikant, der Polizist, der Automat), plus a few others: <b>der Herr, der Mensch, der Nachbar</b>.</p>

<p class="tip">You see it every day in letters: <i>Sehr geehrter Herr Weber</i> (nominative), but <i>Bitte rufen Sie Herr<b>n</b> Weber an.</i></p>` },
    { t: "Adjectives used as nouns", html: `
<p>Many words for people are really adjectives or participles: <i>bekannt</i> → <b>der Bekannte</b> (acquaintance), <i>angestellt</i> → <b>der/die Angestellte</b> (employee). They are written with a capital letter but keep <b>adjective endings</b>, so the ending changes with the article.</p>
<table><tr><th></th><th>with der/die</th><th>with ein/kein/mein</th><th>no article</th></tr>
<tr><td>masc.</td><td>der Bekannt<b>e</b></td><td>ein Bekannt<b>er</b></td><td>—</td></tr>
<tr><td>fem.</td><td>die Bekannt<b>e</b></td><td>eine Bekannt<b>e</b></td><td>—</td></tr>

<p>Other common ones: der/die Deutsche, der/die Erwachsene, der/die Verwandte, der/die Jugendliche.</p>
<p>Neuter adjectives after <b>etwas, nichts, viel, wenig</b> work the same way: <i>etwas Neu<b>es</b></i>, <i>nichts Besonder<b>es</b></i>, <i>viel Gut<b>es</b></i>.</p>

<p>These two-part connectors join two words, phrases or sentences and stress that <b>both</b> are true.</p>

<p>Two subjects joined with <b>sowohl … als auch</b> normally take a <b>plural verb</b>: <i>Sowohl meine Mutter als auch mein Vater <b>wohnen</b> in Haifa.</i></p>

    { t: "Relative clauses with prepositions", html: `
<p>When the verb needs a preposition (<i>sprechen <b>über</b></i>, <i>sich interessieren <b>für</b></i>, <i>gehen <b>mit</b></i>), the preposition stands <b>right before</b> the relative pronoun. The preposition decides the case; the noun decides gender and number.</p>
<table><tr><th>Noun</th><th>Relative clause</th></tr>
<tr><td>der Film</td><td>, <b>über den</b> wir gesprochen haben (über + Akk.)</td></tr>
<tr><td>die Ausstellung</td><td>, <b>für die</b> ich mich interessiere (für + Akk.)</td></tr>
<tr><td>das Theater</td><td>, <b>in dem</b> wir gestern waren (in + Dat.)</td></tr>
<tr><td>die Freunde</td><td>, <b>mit denen</b> ich ins Theater gehe (mit + Dat.)</td></tr></table>
<p>Relative pronoun in the dative: <b>dem</b> (m/n), <b>der</b> (f), <b>denen</b> (plural). The verb goes to the end of the clause.</p>
<p class="tip">English can leave the preposition at the end: "the film we talked <i>about</i>". German never does: <i>der Film, <b>über den</b> wir gesprochen haben</i>. The relative pronoun can't be left out either.</p>` },
    { t: "Relative was and wo", html: `
<p>Use <b>was</b> (not das) as the relative pronoun after:</p>
<table><tr><th>After …</th><th>Example</th></tr>
<tr><td>alles, nichts, etwas, vieles</td><td>Alles, <b>was</b> er gesagt hat, stimmt.</td></tr>
<tr><td>a superlative used as a noun</td><td>Das ist das Beste, <b>was</b> ich je gesehen habe.</td></tr>
<tr><td>a whole sentence</td><td>Die Karten waren ausverkauft, <b>was</b> mich sehr geärgert hat.</td></tr></table>
<p>Use <b>wo</b> after places (and in spoken German also after times):</p>
<p><i>Berlin ist eine Stadt, <b>wo</b> man viel Kultur erleben kann.</i> (= in der man …)<br><i>Ich zeige dir das Café, <b>wo</b> ich immer lese.</i></p>
<p class="tip">With a preposition, <b>was</b> becomes <b>wo(r)- + preposition</b>: <i>Das ist alles, <b>worüber</b> wir gesprochen haben.</i></p>` }
  ],

<p>• <b>predictions</b>: <i>Die Temperaturen werden weiter steigen.</i><br>• <b>promises and resolutions</b>: <i>Ich werde weniger Plastik kaufen.</i><br>• <b>assumptions about now</b>, often with <i>wohl, wahrscheinlich, sicher</i>: <i>Er ist nicht da. Er wird wohl im Stau stehen.</i> (= he's probably stuck in traffic)</p>
<p class="tip">For normal plans Germans usually use the <b>present tense + a time word</b>: <i>Morgen fahre ich nach Haifa.</i> Futur I sounds more like a prediction or a firm promise.</p>` },
    { t: "Passive with modal verbs", html: `
<p>To say what <b>must / should / can</b> be done, combine the modal verb with the passive infinitive: <b>Partizip II + werden</b> at the end.</p>
<table><tr><th>Active (man)</th><th>Passive with modal</th></tr>
<tr><td>Man muss die Heizung reparieren.</td><td>Die Heizung <b>muss</b> repariert <b>werden</b>.</td></tr>
<tr><td>Man soll Plastik reduzieren.</td><td>Plastik <b>soll</b> reduziert <b>werden</b>.</td></tr>

<p>In a subordinate clause the modal verb goes to the very end: <i>Ich finde, dass mehr Bäume gepflanzt <b>werden müssen</b>.</i></p>

    { t: "obwohl vs. trotzdem", html: `
<p>Both express a contrast ("although" / "nevertheless"), but they work differently in the sentence.</p>
<table><tr><th></th><th>Type</th><th>Example</th></tr>
<tr><td><b>obwohl</b></td><td>subordinating – verb at the <b>end</b></td><td><b>Obwohl</b> ich wenig Zeit <b>habe</b>, arbeite ich ehrenamtlich.</td></tr>
<tr><td><b>trotzdem</b></td><td>adverb in a main clause – verb <b>right after</b> it</td><td>Ich habe wenig Zeit. <b>Trotzdem arbeite</b> ich ehrenamtlich.</td></tr></table>
<p><b>trotzdem</b> can also come after the verb: <i>Ich arbeite <b>trotzdem</b> ehrenamtlich.</i></p>
<p class="tip">Hebrew: <b>obwohl</b> ≈ "lamrot she…" (למרות ש…), <b>trotzdem</b> ≈ "u-ve-khol zot" (ובכל זאת). The obwohl-clause gives the obstacle; the trotzdem-sentence gives the surprising result.</p>` },
    { t: "Time clauses: bevor, nachdem, seitdem, bis, während", html: `
<p>All of these send the verb to the <b>end</b> of their clause.</p>
<table><tr><th>Word</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>bevor</b></td><td>before</td><td><b>Bevor</b> du den Antrag abgibst, kopier alle Dokumente.</td></tr>
<tr><td><b>nachdem</b></td><td>after</td><td><b>Nachdem</b> wir gewählt <b>hatten</b>, sind wir ins Café gegangen.</td></tr>
<tr><td><b>seitdem / seit</b></td><td>since</td><td><b>Seitdem</b> ich hier lebe, lerne ich jeden Tag Deutsch.</td></tr>
<tr><td><b>bis</b></td><td>until</td><td>Warte bitte, <b>bis</b> die Ergebnisse da sind.</td></tr>
<tr><td><b>während</b></td><td>while</td><td><b>Während</b> er spricht, machen wir Notizen.</td></tr></table>
<p><b>nachdem</b> needs a tense shift: the nachdem-action happened <b>earlier</b>. Main clause in Perfekt/Präteritum → nachdem-clause in <b>Plusquamperfekt</b>; main clause in Präsens → nachdem-clause in Perfekt.</p>
<p class="tip">Don't mix up the preposition <i>vor</i> / <i>nach</i> (+ noun: <i>nach der Wahl</i>) with the conjunction <i>bevor</i> / <i>nachdem</i> (+ clause: <i>nachdem die Wahl vorbei war</i>).</p>` },

<p><b>je</b> + comparative … , <b>desto</b> (or <b>umso</b>) + comparative … = "the more …, the more …".</p>
<table><tr><th>je-part (verb at end)</th><th>desto-part (verb right after the comparative)</th></tr>
<tr><td><b>Je</b> länger ich hier <b>lebe</b>,</td><td><b>desto</b> besser <b>verstehe</b> ich die Gesellschaft.</td></tr>
<tr><td><b>Je</b> mehr Menschen sich <b>engagieren</b>,</td><td><b>desto</b> stärker <b>ist</b> die Demokratie.</td></tr></table>
<p class="tip">Word order is the tricky part: the je-part is a subordinate clause (verb last), the desto-part starts with <i>desto + comparative</i>, then the verb, then the subject.</p>` }

<p>News, reports and formal writing use <b>Konjunktiv I</b> to show: "this is what <i>someone else</i> said, not my claim". Take the infinitive stem and add the endings. In practice you mostly need the <b>er/sie/es</b> form.</p>

<tr><td>haben</td><td>hab<b>e</b></td><td>hat</td></tr>

    { t: "Partizip II as an adjective", html: `

<p>A <b>concession</b> admits a fact that seems to speak against your statement, and then keeps the statement anyway. German has several ways to do this, and each one has its own word order.</p>
<table><tr><th>Structure</th><th>Type</th><th>Example</th></tr>
<tr><td><b>obwohl</b></td><td>conjunction, verb at end</td><td>Ich fahre Rad, <b>obwohl</b> es <b>regnet</b>.</td></tr>
<tr><td><b>auch wenn</b></td><td>conjunction, verb at end</td><td><b>Auch wenn</b> es teurer <b>ist</b>, kaufe ich regional.</td></tr>
<tr><td><b>selbst wenn</b></td><td>"even if", often hypothetical</td><td><b>Selbst wenn</b> alle mitmachen <b>würden</b>, wäre das nicht genug.</td></tr>
<tr><td><b>trotzdem / dennoch</b></td><td>adverb, verb comes next</td><td>Es regnet. <b>Dennoch fahre</b> ich Rad.</td></tr>
<tr><td><b>zwar … aber</b></td><td>two main clauses</td><td>Das ist <b>zwar</b> teuer, <b>aber</b> es lohnt sich.</td></tr>
<tr><td><b>trotz</b> + Genitiv</td><td>preposition</td><td><b>Trotz</b> der hohen Kosten investiert die Stadt.</td></tr></table>
<p>When the concessive clause comes first, the main clause starts with the verb: <i>Obwohl es teuer ist, <b>lohnt</b> es sich.</i></p>

    { t: "Modal particles", html: `
<p>Modal particles are small, unstressed words that native speakers use constantly. They don't change the facts of a sentence, but they show the speaker's <b>attitude</b>. Without them, spoken German often sounds stiff.</p>
<table><tr><th>Particle</th><th>Meaning / attitude</th><th>Example</th></tr>
<tr><td><b>ja</b></td><td>surprise, or "as we both know"</td><td>Du bist <b>ja</b> ganz nass! · Das weißt du <b>ja</b>.</td></tr>
<tr><td><b>doch</b></td><td>reminder, mild reproach, urging</td><td>Das habe ich dir <b>doch</b> gesagt! · Komm <b>doch</b> mit!</td></tr>
<tr><td><b>eben / halt</b></td><td>resignation: can't be changed</td><td>Das ist <b>eben</b> so. · Dann warten wir <b>halt</b>.</td></tr>
<tr><td><b>mal</b></td><td>softens a request</td><td>Kannst du <b>mal</b> kurz helfen?</td></tr>
<tr><td><b>wohl</b></td><td>assumption: "probably"</td><td>Sie ist <b>wohl</b> schon weg.</td></tr></table>
<p>Particles stand in the middle of the sentence, after the verb and usually after pronouns: <i>Das habe ich dir <b>doch</b> gesagt.</i> They never take position 1.</p>
<p class="tip">Hebrew הרי (harei) works a lot like <b>ja / doch</b>: "after all, you know that". English often uses intonation or tags instead: <i>Das weißt du doch!</i> = "You know that, don't you!" <b>halt</b> is more colloquial and southern; <b>eben</b> works everywhere.</p>` },
    { t: "Emphasis in the sentence", html: `
<p>German word order is flexible, so you can highlight information by moving it to <b>position 1</b>. What comes first gets the attention, often as a contrast.</p>
<table><tr><th>Neutral</th><th>Emphasised</th></tr>
<tr><td>Ich habe diese Quelle nicht überprüft.</td><td><b>Diese Quelle</b> habe ich nicht überprüft (die anderen schon).</td></tr>
<tr><td>Ich habe erst gestern davon erfahren.</td><td><b>Erst gestern</b> habe ich davon erfahren.</td></tr></table>
<p><b>Focus words</b> point to one part of the sentence:</p>
<table><tr><th>Word</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>sogar</b></td><td>even</td><td><b>Sogar</b> seriöse Zeitungen haben es übernommen.</td></tr>
<tr><td><b>gerade</b></td><td>precisely, especially</td><td><b>Gerade</b> heute brauchen wir guten Journalismus.</td></tr>
<tr><td><b>ausgerechnet</b></td><td>of all things / people (annoyed)</td><td><b>Ausgerechnet</b> am Wahltag tauchte das Gerücht auf.</td></tr>
<tr><td><b>nur / erst</b></td><td>only / not until</td><td><b>Erst</b> nach dem Faktencheck war es klar.</td></tr></table>
<p class="tip">In speech you can also simply stress a word: <i>ICH habe das nicht geteilt</i> (someone else did).</p>` }

    { t: "Nomen-Verb-Verbindungen", html: `
<p>Formal German (business, news, official letters) loves <b>noun-verb combinations</b>: a noun carries the meaning, and a fairly "empty" verb like <i>treffen, stellen, nehmen, kommen, bringen</i> makes it a verb. Often a simple verb means almost the same.</p>
<table><tr><th>Nomen-Verb-Verbindung</th><th>Simple verb</th><th>English</th></tr>
<tr><td>eine Entscheidung <b>treffen</b></td><td>entscheiden</td><td>to make a decision</td></tr>
<tr><td>eine Frage <b>stellen</b></td><td>fragen</td><td>to ask a question</td></tr>
<tr><td>einen Antrag <b>stellen</b></td><td>beantragen</td><td>to apply</td></tr>
<tr><td>Kritik <b>üben</b> an</td><td>kritisieren</td><td>to criticise</td></tr>
<tr><td>Einfluss <b>nehmen</b> auf</td><td>beeinflussen</td><td>to influence</td></tr>
<tr><td>in Anspruch <b>nehmen</b></td><td>nutzen</td><td>to make use of</td></tr>
<tr><td>in Kauf <b>nehmen</b></td><td>(notgedrungen) akzeptieren</td><td>to put up with</td></tr>
<tr><td>eine Rolle <b>spielen</b></td><td>wichtig sein</td><td>to play a role</td></tr></table>
<p>The verb part is conjugated and stands in position 2; the noun part goes to the <b>end</b>, like a separable prefix: <i>Wir <b>treffen</b> morgen eine <b>Entscheidung</b>.</i> · <i>Ein Kredit <b>kommt</b> nicht in <b>Frage</b>.</i></p>
<p class="tip">Learn them as fixed chunks. You can't swap the verb: it's <i>eine Entscheidung <b>treffen</b></i>, never "machen" (unlike English "make a decision").</p>` },
    { t: "Active and passive pairs", html: `
<p>Many combinations come in pairs. With <b>stellen / bringen / setzen</b> someone actively does something; with <b>stehen / kommen</b> something happens or is the case.</p>
<table><tr><th>Active (someone does it)</th><th>Passive-like (it happens / is so)</th></tr>
<tr><td>Die Firma <b>stellt</b> Laptops zur Verfügung.</td><td>Laptops <b>stehen</b> zur Verfügung.</td></tr>
<tr><td>Wir <b>bringen</b> das Projekt zum Abschluss.</td><td>Das Projekt <b>kommt</b> zum Abschluss.</td></tr>
<tr><td>Die Chefin <b>setzt</b> den Plan in Gang.</td><td>Der Plan <b>kommt</b> in Gang.</td></tr>
<tr><td>Sie <b>bringt</b> ihre Kritik zum Ausdruck.</td><td>Ihre Kritik <b>kommt</b> zum Ausdruck.</td></tr></table>
<p class="tip">Careful: <b>in Frage stellen</b> = to question, to doubt. <b>in Frage kommen</b> = to be a possible option. <i>Die Studie stellt das Ergebnis in Frage.</i> vs. <i>Dieser Kandidat kommt in Frage.</i></p>` }

    { t: "Prepositions with the genitive", html: `
<p>Formal and written German uses a group of prepositions that take the <b>genitive</b>. You already know <i>wegen, trotz, während</i>. At B2 you need these too:</p>
<table><tr><th>Preposition</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>aufgrund</b></td><td>due to</td><td>aufgrund <b>des</b> schlecht<b>en</b> Wetter<b>s</b></td></tr>
<tr><td><b>anlässlich</b></td><td>on the occasion of</td><td>anlässlich <b>des</b> Jubiläum<b>s</b></td></tr>
<tr><td><b>hinsichtlich</b></td><td>with regard to</td><td>hinsichtlich <b>der</b> Kosten</td></tr>
<tr><td><b>innerhalb</b></td><td>within (time / place)</td><td>innerhalb <b>eines</b> Jahr<b>es</b></td></tr>
<tr><td><b>außerhalb</b></td><td>outside</td><td>außerhalb <b>der</b> Stadt</td></tr>
<tr><td><b>mithilfe</b></td><td>with the help of</td><td>mithilfe <b>einer</b> App</td></tr></table>
<p>Genitive reminder: masculine and neuter <b>des / eines</b> + noun with <b>-(e)s</b>; feminine and plural <b>der</b>. Adjectives after an article end in <b>-en</b>; without an article, plural adjectives end in <b>-er</b>: <i>mithilfe zahlreich<b>er</b> Spenden</i>.</p>
<p class="tip">When there is no article, use <b>von</b> + dative instead: <i>innerhalb <b>von</b> zwei Wochen</i>, <i>mithilfe <b>von</b> Freunden</i>. In everyday speech you will hear these prepositions much less than in news and letters.</p>` },
    { t: "Relative clauses with wer and was", html: `
<p><b>wer</b> means "whoever / anyone who". The main clause can pick it up with <b>der</b> (or dem, den …) in the case the main verb needs.</p>
<table><tr><th>Relative clause</th><th>Main clause</th></tr>
<tr><td><b>Wer</b> zu spät kommt,</td><td>(<b>der</b>) muss bis zur Pause warten.</td></tr>
<tr><td><b>Wer</b> Kunst liebt,</td><td><b>dem</b> wird diese Ausstellung gefallen. (gefallen + Dativ)</td></tr>
<tr><td><b>Wem</b> das Stück nicht gefällt,</td><td><b>der</b> kann gehen.</td></tr></table>
<p>If both parts are nominative, <b>der</b> can be left out. If the cases differ, you need it.</p>
<p><b>was</b> refers to something general, not to a specific noun:</p>
<table><tr><th>Use</th><th>Example</th></tr>
<tr><td>as a subject or object idea</td><td><b>Was</b> mich beeindruckt hat, (<b>das</b>) war das Bühnenbild.</td></tr>
<tr><td>after alles, etwas, nichts, vieles</td><td>Das ist alles, <b>was</b> ich weiß.</td></tr>
<tr><td>after a superlative used as a noun</td><td>Das ist das Beste, <b>was</b> ich je gesehen habe.</td></tr>
<tr><td>referring to a whole clause</td><td>Sie hat den Preis gewonnen, <b>was</b> niemanden überrascht hat.</td></tr></table>
<p class="tip">English: "Whoever …" / "What impressed me was …". Proverbs love this pattern: <i>Wer zuletzt lacht, lacht am besten.</i></p>` }

    { t: "Konjunktiv II in the past", html: `
<p>To talk about things that did <b>not</b> happen in the past (regrets, alternatives), use <b>hätte / wäre</b> + Partizip II.</p>
<table><tr><th>Reality</th><th>Konjunktiv II Vergangenheit</th></tr>
<tr><td>Ich wusste es nicht.</td><td>Wenn ich es gewusst <b>hätte</b>, <b>hätte</b> ich dir geholfen.</td></tr>
<tr><td>Wir sind spät losgefahren.</td><td>Wenn wir früher losgefahren <b>wären</b>, <b>hätten</b> wir den Zug erreicht.</td></tr>
<tr><td>Ich bin nicht lange geblieben.</td><td>Ich <b>wäre</b> gern länger geblieben.</td></tr></table>
<p>Choose <b>wäre</b> for verbs that form the Perfekt with <i>sein</i> (gehen, fahren, bleiben, passieren …), <b>hätte</b> for all others.</p>` },
    { t: "hätte … machen sollen / können / müssen", html: `
<p>With a modal verb, the past Konjunktiv II uses <b>hätte</b> + infinitive + modal verb in the <b>infinitive</b> (a "double infinitive"). There is no Partizip II!</p>
<table><tr><th>German</th><th>English</th></tr>
<tr><td>Ich <b>hätte</b> früher anrufen <b>sollen</b>.</td><td>I should have called earlier.</td></tr>
<tr><td>Wir <b>hätten</b> den Konflikt vermeiden <b>können</b>.</td><td>We could have avoided the conflict.</td></tr>
<tr><td>Du <b>hättest</b> dich entschuldigen <b>müssen</b>.</td><td>You would have had to apologise.</td></tr>
<tr><td>Das <b>hätte</b> er nicht sagen <b>dürfen</b>.</td><td>He shouldn't have said that.</td></tr></table>
<p>It is always <b>hätte</b>, even with verbs of motion: <i>Ich <b>hätte</b> mitkommen können.</i></p>
<p>In a subordinate clause, <b>hätte</b> jumps in front of the two infinitives: <i>Ich weiß, dass ich früher <b>hätte</b> anrufen sollen.</i></p>
<p class="tip">English "should have done" uses a participle; German doesn't. Think: <i>hätte</i> + two infinitives at the end.</p>` },
    { t: "als ob / als wenn + Konjunktiv II", html: `
<p><b>als ob</b> and <b>als wenn</b> ("as if") describe an impression that is not (or may not be) true. They take the Konjunktiv II, verb at the end.</p>
<table><tr><th>Time</th><th>Example</th></tr>
<tr><td>same time</td><td>Er redet, <b>als ob</b> er der Chef <b>wäre</b>. · Sie tut so, <b>als wenn</b> sie alles <b>wüsste</b>.</td></tr>
<tr><td>earlier</td><td>Er tut so, <b>als ob</b> nichts passiert <b>wäre</b>. · Du siehst aus, <b>als ob</b> du nicht geschlafen <b>hättest</b>.</td></tr>
<tr><td>with würde</td><td>Es sieht aus, <b>als ob</b> es gleich regnen <b>würde</b>.</td></tr></table>
<p>You can also drop <i>ob/wenn</i>: then the verb comes straight after <b>als</b>: <i>Er redet, <b>als wäre</b> er der Chef.</i></p>
<p class="tip">Typical frames: <i>so tun, als ob …</i> (to pretend) · <i>aussehen, als ob …</i> · <i>sich anfühlen, als ob …</i></p>` }

    { t: "Prepositional verbs with da- and wo-", html: `
<p>Many verbs have a fixed preposition: <i>achten <b>auf</b>, sich ärgern <b>über</b>, rechnen <b>mit</b>, sich gewöhnen <b>an</b>, sich verlassen <b>auf</b></i>. When the "object" is a whole clause (dass…, ob…, zu + infinitive), the main clause contains a <b>da(r)- word</b> that points forward to it, a so-called correlate.</p>
<table><tr><th>Verb + preposition</th><th>With a noun</th><th>With a clause</th></tr>
<tr><td>achten auf</td><td>Ich achte <b>auf</b> die Zeit.</td><td>Ich achte <b>darauf</b>, dass ich pünktlich bin.</td></tr>
<tr><td>sich ärgern über</td><td>Er ärgert sich <b>über</b> den Fehler.</td><td>Er ärgert sich <b>darüber</b>, dass niemand zuhört.</td></tr>
<tr><td>rechnen mit</td><td>Wir rechnen <b>mit</b> Veränderungen.</td><td>Wir rechnen <b>damit</b>, dass vieles automatisiert wird.</td></tr>
<tr><td>sich gewöhnen an</td><td>Ich gewöhne mich <b>an</b> das Homeoffice.</td><td>Ich habe mich <b>daran</b> gewöhnt, zu Hause zu arbeiten.</td></tr></table>
<p><b>da</b> + preposition, with an extra <b>r</b> before a vowel: da<b>mit</b>, da<b>für</b>, da<b>r</b>auf, da<b>r</b>über, da<b>r</b>an.</p>
<p>Questions about things use <b>wo(r)-</b>: <i><b>Worauf</b> achtest du?</i> · <i><b>Worüber</b> ärgerst du dich?</i> For people, use preposition + wen/wem: <i><b>Auf wen</b> kann ich mich verlassen?</i></p>
<p class="tip">English simply says "I make sure that …" or "I'm annoyed that …". German needs the little bridge word: <i>Ich ärgere mich <b>darüber</b>, dass …</i></p>` },
    { t: "Phrases for discussions and presentations", html: `
<table><tr><th>Purpose</th><th>Phrases</th></tr>
<tr><td>Introducing</td><td>In meinem Vortrag geht es um … · <b>Zunächst</b> möchte ich kurz erklären, …</td></tr>
<tr><td>Structuring</td><td>Mein Vortrag gliedert sich in drei Teile. · Erstens … zweitens … · Damit komme ich zum nächsten Punkt.</td></tr>
<tr><td>Pointing out</td><td>Ich möchte <b>darauf hinweisen</b>, dass … · Besonders wichtig ist …</td></tr>
<tr><td>Agreeing</td><td>Da stimme ich Ihnen zu. · Dem kann ich nur zustimmen.</td></tr>
<tr><td>Contradicting politely</td><td>Ich verstehe Ihren <b>Standpunkt</b>, aber … · <b>Da bin ich anderer Meinung.</b> · Das sehe ich etwas anders, denn …</td></tr>
<tr><td>Interrupting / adding</td><td><b>Darf ich kurz unterbrechen?</b> · Dazu möchte ich etwas ergänzen.</td></tr>
<tr><td>Concluding</td><td>Damit komme ich zum Schluss. · Lassen Sie mich <b>zusammenfassen</b>: … · <b>Abschließend</b> lässt sich sagen, dass …</td></tr></table>
<p class="tip">In a German discussion it is fine to disagree directly, but softeners like <i>etwas</i>, <i>allerdings</i> and the Konjunktiv (<i>Ich würde sagen …</i>) keep it polite.</p>` }

function checkWord(answer, w) {
  const a = norm(answer), t = norm(w.de);

    if (nounOk && art === w.art) return { ok: true, typo: true };

  if (res.noArticle) return { cls: "bad", msg: `Right word, but say it with the article: <span class="${gClass(w)}">${w.art}</span>.`, auto: 0 };

async function spListen() {
  const btn = $(".mic"); if (rec) { rec.stop(); return; }
  btn && btn.classList.add("live");
  try {
    const alts = await listen(t => { const h = $("#heard"); if (h) h.textContent = t; });
    btn && btn.classList.remove("live");
    if (!alts.length) return toast("I didn't hear anything. Tap the mic and speak.");
    sp.total++; day().spoke++;
    const it = sp.items[sp.i];
    setTimeout(() => addXP(sp.kind === "shadow" && sp.result?.score >= 0.9 ? 5 : 3, sp.result?.score >= 0.9 ? "clear!" : ""), 50);
    if (sp.kind === "shadow") {
      const tgt = norm(it.text).split(" ");
      let best = null;
      for (const a of alts) { const r = align(tgt, norm(a).split(" ")); if (!best || r.score > best.score) best = { ...r, heard: a }; }

    } else {
      const acc = it.accept.map(norm);
      const hitAlt = alts.find(a => { const n = " " + norm(a) + " "; return acc.some(p => n.includes(" " + p + " ") || n.includes(p)); });
      sp.heard = hitAlt || alts[0];
      const heard = norm(sp.heard).split(" ");
      const model = it.model.map(t => ({ text: t, ...align(norm(t).split(" "), heard) })).sort((a, b) => b.score - a.score)[0];
      sp.result = { ok: !!hitAlt && heard.length >= 2 || (!!hitAlt && it.accept.some(p => ["ja", "nein"].includes(p))), model };
    }

  } catch (err) { btn && btn.classList.remove("live"); micError(err); render(); }
}

async function recStart(text) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream), chunks = [];
    if (recState && recState.url) URL.revokeObjectURL(recState.url);
    recState = { text, live: true, mr };
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); recState.url = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType })); recState.live = false; render(); };
    mr.start(); render();
    setTimeout(() => { if (recState && recState.mr === mr && mr.state === "recording") mr.stop(); }, 10000);
  } catch (e) { toast("Couldn't use the microphone here."); }
}
function playMine() { return new Promise(res => { const a = new Audio(recState.url); a.onended = res; a.onerror = res; a.play().catch(res); }); }
async function recCompare() {
  const text = recState.text;
  try { const p = hasClip(text) && !S.settings.deviceVoice ? await playClip(text, 1) : null; if (p) await new Promise(r => { p.onended = r; }); else { say(text); await new Promise(r => setTimeout(r, 400 + text.length * 70)); } } catch (e) {}
  await new Promise(r => setTimeout(r, 300)); await playMine();
}

  const art = Object.entries(S.gender || {}).filter(([id, x]) => WORDS[id] && x.w > x.r / 2).sort((a, b) => b[1].w - a[1].w).slice(0, 8).map(([id]) => WORDS[id].de);

  const bm = recent.filter(m => m.b && bstepOf(m.b)).map(m => `"${bstepOf(m.b).en}" → ${bstepOf(m.b).de}${m.got ? ` (Or said: ${m.got})` : ""}`);

  out.push(`How the app works: it leads Or through one planned daily lesson (warm-up of due words and sentences, new words, a grammar point with checked exercises, building sentences from English out loud, repeat-after-me, questions, and a short conversation with you). Or doesn't choose what to practise; the app and you do. ${today_?.lessons ? "Today's lesson is done, so in this chat give extra practice on Or's weak points from this profile." : "Today's lesson isn't done yet: if Or asks what to do, send them to start it (\"Start today's lesson\" on the Lernen tab) before extra practice."}`);

    } else { $("#exScore").textContent += ` · ${Math.ceil(L.ex.length * 0.7)} needed to pass. Look at the answers and try again.`; }
  },
  startReview: d => { gsess = null; startReview(d.mode || "flip"); },
  endReview: () => { if (rec) rec.abort(); sess = null; render(); },
  learnt: () => { sess.verdict = null; const id = sess.cur; S.cards[id] = { ...card(id), s: "learn", step: 0, due: Date.now() + MIN, last: Date.now() }; day().nw++; sess.q.shift(); sess.q.splice(Math.min(sess.q.length, 3), 0, id); nextCard(); save(); render(); },
  reveal: () => { sess.phase = "show"; sess.result = null; render(); say(WORDS[sess.cur].de); },
  grade: d => gradeCard(+d.r),
  ins: d => { const i = $("#typein"); if (!i) return; const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + d.ch + i.value.slice(p); i.focus(); i.setSelectionRange(p + 1, p + 1); },
  checkType: () => { const i = $("#typein"); const v = i ? i.value.trim() : ""; if (!v) return i && i.focus(); const w = WORDS[sess.cur]; sess.result = feedback(checkWord(v, w), w, v, true); sess.phase = "show"; render(); say(w.de); },
  speakWord: () => speakWord(),
  cardListen: () => cardListen(false),
  cardRetry: () => cardListen(true),
  cardNext: () => cardAdvance(),
  cardOverride: () => { sess.grade = 2; cardAdvance(); },
  dontKnow: () => { const w = WORDS[sess.cur]; sess.verdict = { v: "bad", grade: 0, kind: "dk", title: "Here it is", detail: "Listen, then say it out loud. It comes back in a few minutes." }; sess.grade = 0; render(); say(w.de); },
  startGender: () => { sess = null; startGender(); },
  endGender: () => { gsess = null; render(); },
  gpick: d => { if (gsess.picked) return; const w = WORDS[gsess.q[gsess.i]]; gsess.picked = d.a; const g = S.gender[w.id] ||= { r: 0, w: 0 }; if (d.a === w.art) { g.r++; gsess.ok++; } else g.w++; day().rev++; save(); render(); say(w.de); },
  gnext: () => { gsess.i++; gsess.picked = null; render(); if (gsess.i >= gsess.q.length) { addXP(gsess.ok, "articles"); if (gsess.ok / gsess.q.length >= 0.8) celebrate({ title: gsess.ok === gsess.q.length ? "Alle richtig!" : "Sehr gut!", sub: `${gsess.ok} of ${gsess.q.length} articles right.` }); } },
  startSpeak: d => startSpeak(d.kind, d.lesson),
  endSpeak: () => { if (rec) rec.abort(); sp = null; render(); },
  spSay: d => sayCurrent(d.slow ? 0.65 : undefined),
  spListen: () => spListen(),
  spRetry: () => { sp.result = null; sp.heard = ""; for (const k in chk) delete chk[k]; render(); },
  spNext: () => {
    if (rec) rec.abort(); recState = null; sp.i++; sp.result = null; sp.heard = ""; render();
    if (sp.i >= sp.items.length) {
      if (sp.total) { if (!micBlocked) addXP(5, "round"); if (!(sp.lesson && finishPart(sp.lesson, "speak") && lessonState(sp.lesson).done)) celebrate({ title: "Gut gesprochen!", sub: `You spoke ${sp.total} times this round.${sp.lesson && lessonState(sp.lesson).parts?.speak ? ` Speaking step for Lektion ${sp.lesson} is done.` : ""}` }); }
      return;
    }
    setTimeout(() => sayCurrent(), 200);
  },
  spHide: () => { sp.hide = !sp.hide; render(); },
  saySlow: d => say(d.text, 0.7),
  check: (d, el) => checkSay(d.text, d.partner, el),
  recStart: d => recStart(d.text),
  recStop: () => { if (recState && recState.mr && recState.mr.state === "recording") recState.mr.stop(); },
  recPlay: () => playMine(),
  recCompare: () => recCompare(),
  openSound: d => { soundId = d.id || null; quiz = null; view = "sounds"; render(); window.scrollTo(0, 0); },
  quizStart: () => { quiz = { n: 0, ok: 0 }; quizRound(); },
  quizReplay: () => say(quiz.cur.ans, 1),
  quizPick: d => { quiz.picked = d.w; if (d.w === quiz.cur.ans) quiz.ok++; render(); },
  quizNext: () => { quiz.n++; if (quiz.n < 8) quizRound(); else render(); },
  unhide: () => { if (sp && sp.hide && !sp.result) { sp.hide = false; render(); } },
  selfReveal: () => { sp.total++; day().spoke++; sp.result = { self: true }; save(); render(); },
  exportData: () => { $("#backup").value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); },
  copyData: () => { const t = $("#backup"); if (!t.value) A.exportData(); navigator.clipboard?.writeText(t.value).then(() => toast("Copied"), () => { t.select(); toast("Select all and copy"); }) ?? (t.select(), toast("Select all and copy")); },
  importData: () => { try { const v = $("#backup").value.trim(); const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!o.cards) throw 0; S = Object.assign(fresh(), o); save(); toast("Progress restored"); render(); } catch (e) { toast("That code didn't work. Paste the whole backup code."); } },
  resetAsk: () => { $("#resetBox").hidden = false; },
  resetDo: () => { S = fresh(); save(); sess = gsess = sp = null; toast("Progress reset"); render(); }
};

document.addEventListener("click", e => {
  if (e.target.classList.contains("celebrate")) return closeCel();
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener("input", e => { if (e.target.id === "lehrerIn") { chat.draft = e.target.value; if (dict) { dict.base = e.target.value; dict.interim = ""; } } });
document.addEventListener("change", e => {
  const k = e.target.dataset.set; if (!k) return;
  S.settings[k] = k === "voice" || k === "lehrerModel" ? e.target.value : +e.target.value; save(); toast("Saved");
});
document.addEventListener("keydown", e => {
  const cel = document.querySelector(".celebrate");
  if (cel) { if (e.key === "Escape") { e.preventDefault(); closeCel(); } return; }
  if (view === "teach" && T) {
    if (e.key !== "Enter" && !(e.key === " " && !e.target.matches("input, textarea"))) return;
    const b = $('#main [data-act="teachNext"]') || $('#main [data-act$="Type"]') || $('#main .mic') || $('#main [data-act="teachExCheck"]');
    if (b && !(e.key === "Enter" && e.target.matches("button"))) { e.preventDefault(); b.click(); }
    return;
  }
  if (e.target.id === "lehrerIn") { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } return; }
  if (e.target.matches("input, textarea, select")) { if (e.key === "Enter" && e.target.id === "typein") { e.preventDefault(); A.checkType(); } if (e.key === "Enter" && e.target.id === "pw") (signin.mode === "create" ? A.createPassword() : A.pwSignin()); return; }
  if (view === "review" && gsess && gsess.i < gsess.q.length) {
    if (!gsess.picked && ["1", "2", "3"].includes(e.key)) A.gpick({ a: ["der", "die", "das"][+e.key - 1] });
    else if (gsess.picked && (e.key === " " || e.key === "Enter")) { e.preventDefault(); A.gnext(); }
    return;
  }
  if (view === "review" && sess && sess.cur && sess.mode === "speak" && !micBlocked) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (sess.verdict) { card(sess.cur).s === "new" ? A.learnt() : A.cardNext(); } else A.cardListen(); }
    return;
  }
  if (view === "review" && sess && sess.cur) {
    const c = card(sess.cur);
    if (sess.phase === "ask" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); c.s === "new" ? A.learnt() : sess.mode === "type" ? null : A.reveal(); }
    else if (sess.phase === "show" && !(sess.result && sess.result.auto != null) && ["1", "2", "3", "4"].includes(e.key)) gradeCard(+e.key - 1);
    else if (sess.phase === "show" && sess.result && sess.result.auto != null && (e.key === " " || e.key === "Enter")) { e.preventDefault(); gradeCard(sess.result.auto); }
  }
});

if (CFG) { readAuthHash(); pull(); window.addEventListener("focus", () => pull()); }
render();
})();
</script>
</body>
